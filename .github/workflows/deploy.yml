name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the frozen-spec guard needs history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The arithmetic, with no browser involved. This is the part that must
      # be right, and it is the same module the page ships.
      - name: Scoring tests
        run: bun run test

      # The published JSON is generated, never hand-edited.
      - name: Published JSON matches the source
        run: bun run emit:check

      # The spec prose restates the same data; nothing else stops it drifting.
      - name: Specification prose matches the source
        run: bun run scripts/check-spec.ts

      # A published version may already have been cited.
      - name: No already-published spec version was modified
        run: bun run scripts/check-frozen-spec.ts origin/${{ github.event.repository.default_branch }}

      # Builds _site/ and fails above the page-weight budget.
      - name: Build and enforce the page-weight budget
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke tests
        run: bunx playwright test

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: _site
          retention-days: 7

  # Deploys only from master, and only after every check above has passed.
  # A red build cannot publish.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
